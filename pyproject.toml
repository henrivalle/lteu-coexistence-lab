[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lteu-coexistence-lab"
version = "0.1.0"
description = "An educational lab for estimating free slots under observed LTE-U availability"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
lteu-coexistence-lab = "lteu_lab.__main__:main"

[tool.setuptools]
packages = ["lteu_lab"]
